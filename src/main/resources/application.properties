# Configuração padrão do Sistema de Biblioteca.
# Cada chave pode ser sobrescrita por -Dchave=valor na linha de comando.
# Credenciais do banco NÃO ficam aqui: use as variáveis de ambiente indicadas abaixo (D-07).

# --- Perfil de execução (R8, D-09): escolhe UMA vez a família de persistência ---
# memoria  -> FabricaEmMemoria (testes e demo com dados de exemplo)
# producao -> FabricaRelacional (MySQL)
perfil=memoria

# --- Circulação (B-01, B-02) ---
emprestimo.prazo.dias=30
renovacao.acrescimo.dias=30
renovacao.maximo=2

# --- Configuração administrativa da multa (R2, B-10, B-11) ---
# original | teto | tolerancia  (pode ser trocada em tempo de execução pela CLI do administrador)
multa.politica=original

# --- Banco da instalação (R3, B-15): A | B ---
banco=A

# --- Consulta ao acervo (R9, C-09): decoradores ligados/desligados; a ordem é fixa ---
consulta.medicao=true
consulta.cache=true

# --- E-mail simulado (R5, B-20): true força falha para demonstrar o isolamento dos ouvintes ---
email.falhar=false

# --- MySQL (perfil producao, D-07) ---
# URL, usuário e senha vêm das variáveis de ambiente:
#   BIBLIOTECA_DB_URL     (padrão abaixo)
#   BIBLIOTECA_DB_USUARIO
#   BIBLIOTECA_DB_SENHA
db.url.padrao=jdbc:mysql://localhost:3306/biblioteca?serverTimezone=America/Sao_Paulo
